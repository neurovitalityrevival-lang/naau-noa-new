name: ブログ自動公開

on:
  schedule:
    - cron: '0 0 * * *'  # 毎朝9時JST（UTC 00:00）
  workflow_dispatch:       # 手動実行も可能

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4

      - name: Node.js セットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: ブログ記事を公開
        run: node blog/publish.js

      - name: 変更をコミット＆プッシュ
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add blog/
          git diff --staged --quiet && echo "公開する記事なし" || (
            git commit -m "📝 ブログ自動公開 $(TZ=Asia/Tokyo date +'%Y年%m月%d日')"
            git push
          )
